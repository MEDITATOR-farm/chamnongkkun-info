<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오목</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Noto+Sans+KR:wght@300;400;500&display=swap');

  :root {
    --board-bg: #c8a96e;
    --board-line: #7a5c2e;
    --board-shadow: rgba(80,40,0,0.35);
    --stone-black: #1a1a1a;
    --stone-white: #f5f0e8;
    --stone-black-shine: rgba(255,255,255,0.18);
    --stone-white-shine: rgba(255,255,255,0.7);
    --stone-black-edge: #444;
    --stone-white-edge: #c8bfaa;
    --accent: #8b3a2a;
    --bg: #2a1f12;
    --panel-bg: #1e160c;
    --text-light: #e8d9b8;
    --text-muted: #9c8060;
    --border: rgba(200,169,110,0.25);
    --win-glow: rgba(255,210,80,0.6);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: var(--text-light);
    background-image:
      radial-gradient(ellipse at 20% 20%, rgba(90,60,20,0.4) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(60,30,5,0.5) 0%, transparent 60%);
  }

  h1 {
    font-family: 'Noto Serif KR', serif;
    font-size: 2rem;
    letter-spacing: 0.3em;
    color: var(--board-bg);
    text-shadow: 0 2px 12px rgba(200,169,110,0.4);
    margin-bottom: 6px;
  }

  .subtitle {
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    margin-bottom: 24px;
  }

  .game-wrapper {
    display: flex;
    gap: 20px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }

  /* Board */
  .board-container {
    position: relative;
  }

  canvas#board {
    display: block;
    border-radius: 6px;
    box-shadow:
      0 0 0 6px #7a5c2e,
      0 0 0 10px #5a3e18,
      0 12px 40px rgba(0,0,0,0.6),
      inset 0 0 40px rgba(0,0,0,0.15);
    cursor: crosshair;
  }

  /* Side Panel */
  .panel {
    width: 180px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .player-card {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    background: var(--panel-bg);
    transition: border-color 0.3s, box-shadow 0.3s;
    position: relative;
    overflow: hidden;
  }

  .player-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: transparent;
    transition: background 0.3s;
  }

  .player-card.active {
    border-color: var(--board-bg);
    box-shadow: 0 0 20px rgba(200,169,110,0.15);
  }

  .player-card.active::before {
    background: linear-gradient(90deg, transparent, var(--board-bg), transparent);
  }

  .player-card.winner {
    border-color: #ffd050;
    box-shadow: 0 0 24px rgba(255,208,80,0.3);
    animation: winPulse 1s ease-in-out infinite alternate;
  }

  @keyframes winPulse {
    from { box-shadow: 0 0 16px rgba(255,208,80,0.2); }
    to   { box-shadow: 0 0 32px rgba(255,208,80,0.5); }
  }

  .player-label {
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .player-info {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .stone-icon {
    width: 26px; height: 26px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .stone-icon.black {
    background: radial-gradient(circle at 38% 35%, #555, #111 70%);
    box-shadow: inset 0 1px 3px rgba(255,255,255,0.2), 0 2px 6px rgba(0,0,0,0.5);
  }

  .stone-icon.white {
    background: radial-gradient(circle at 38% 35%, #fff, #d4c9b0 70%);
    box-shadow: inset 0 1px 3px rgba(255,255,255,0.8), 0 2px 6px rgba(0,0,0,0.3);
  }

  .player-name {
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--text-light);
  }

  .player-wins {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: 6px;
  }

  .player-wins span {
    color: var(--board-bg);
    font-weight: 500;
  }

  /* Turn indicator */
  .turn-badge {
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    color: var(--bg);
    background: var(--board-bg);
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 500;
    position: absolute;
    top: 12px; right: 12px;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .player-card.active .turn-badge { opacity: 1; }

  /* Status */
  .status-box {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    background: var(--panel-bg);
    font-size: 0.8rem;
    color: var(--text-muted);
    text-align: center;
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1.5;
  }

  .status-box.win {
    color: #ffd050;
    font-family: 'Noto Serif KR', serif;
    font-size: 0.9rem;
    border-color: rgba(255,208,80,0.4);
    animation: winPulse 1s ease-in-out infinite alternate;
  }

  /* Buttons */
  .btn {
    width: 100%;
    padding: 11px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--text-light);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.82rem;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn:hover {
    background: rgba(200,169,110,0.1);
    border-color: var(--board-bg);
    color: var(--board-bg);
  }

  .btn:active { transform: scale(0.97); }

  .btn-primary {
    background: var(--board-bg);
    border-color: var(--board-bg);
    color: var(--bg);
    font-weight: 500;
  }

  .btn-primary:hover {
    background: #d4b07a;
    color: var(--bg);
  }

  .move-count {
    text-align: center;
    font-size: 0.72rem;
    color: var(--text-muted);
    letter-spacing: 0.05em;
  }

  /* Last move indicator */
  .last-move-info {
    text-align: center;
    font-size: 0.7rem;
    color: var(--text-muted);
  }

  @media (max-width: 640px) {
    h1 { font-size: 1.5rem; }
    .panel { width: 100%; flex-direction: row; flex-wrap: wrap; }
    .player-card { flex: 1; min-width: 140px; }
    .status-box { flex: 100%; }
    .btn { flex: 1; min-width: 120px; }
  }
</style>
</head>
<body>

<h1>오목</h1>
<p class="subtitle">GOMOKU · 五目並べ</p>

<div class="game-wrapper">

  <div class="panel">
    <div class="player-card active" id="card-black">
      <div class="player-label">PLAYER 1</div>
      <div class="player-info">
        <div class="stone-icon black"></div>
        <div class="player-name">흑돌</div>
      </div>
      <div class="player-wins">승리 <span id="wins-black">0</span>회</div>
      <div class="turn-badge">차례</div>
    </div>

    <div class="player-card" id="card-white">
      <div class="player-label">PLAYER 2</div>
      <div class="player-info">
        <div class="stone-icon white"></div>
        <div class="player-name">백돌</div>
      </div>
      <div class="player-wins">승리 <span id="wins-white">0</span>회</div>
      <div class="turn-badge">차례</div>
    </div>

    <div class="status-box" id="status">흑돌 먼저 시작합니다</div>

    <div class="move-count" id="move-count">0수</div>

    <button class="btn btn-primary" onclick="resetGame()">새 게임</button>
    <button class="btn" onclick="undoMove()">무르기 ↩</button>
  </div>

  <div class="board-container">
    <canvas id="board" width="540" height="540"></canvas>
  </div>

</div>

<script>
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const SIZE = 15;
const PADDING = 30;
const CELL = (canvas.width - PADDING * 2) / (SIZE - 1);

let board = Array.from({length: SIZE}, () => Array(SIZE).fill(0));
let currentPlayer = 1; // 1=black, 2=white
let gameOver = false;
let moveHistory = [];
let wins = [0, 0, 0]; // index 1=black, 2=white
let lastMove = null;
let winLine = [];

function px(i) { return PADDING + i * CELL; }

function drawBoard() {
  // Wood texture background
  ctx.fillStyle = '#c8a96e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Subtle grain lines
  ctx.strokeStyle = 'rgba(100,65,20,0.07)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 30; i++) {
    const y = Math.random() * canvas.height;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y + (Math.random()-0.5)*20);
    ctx.stroke();
  }

  // Grid lines
  ctx.strokeStyle = '#7a5c2e';
  ctx.lineWidth = 0.8;
  for (let i = 0; i < SIZE; i++) {
    ctx.beginPath();
    ctx.moveTo(px(0), px(i));
    ctx.lineTo(px(SIZE-1), px(i));
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(px(i), px(0));
    ctx.lineTo(px(i), px(SIZE-1));
    ctx.stroke();
  }

  // Border thick lines
  ctx.strokeStyle = '#5a3e18';
  ctx.lineWidth = 2;
  ctx.strokeRect(px(0), px(0), px(SIZE-1)-px(0), px(SIZE-1)-px(0));

  // Star points (화점)
  const stars = [[3,3],[3,11],[7,7],[11,3],[11,11]];
  ctx.fillStyle = '#5a3e18';
  stars.forEach(([r,c]) => {
    ctx.beginPath();
    ctx.arc(px(c), px(r), 4, 0, Math.PI*2);
    ctx.fill();
  });

  // Coordinates (column: 1-15, row: A-O)
  ctx.fillStyle = 'rgba(90,62,24,0.55)';
  ctx.font = '11px "Noto Sans KR", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < SIZE; i++) {
    ctx.fillText(String.fromCharCode(65+i), px(i), PADDING/2);
    ctx.fillText(String.fromCharCode(65+i), px(i), canvas.height - PADDING/2);
    ctx.fillText(i+1, PADDING/2, px(i));
    ctx.fillText(i+1, canvas.width - PADDING/2, px(i));
  }
}

function drawStone(col, row, player, isLast, isWin) {
  const x = px(col), y = px(row);
  const r = CELL * 0.44;

  ctx.save();

  if (isWin) {
    ctx.shadowColor = '#ffd050';
    ctx.shadowBlur = 18;
  }

  if (player === 1) {
    // Black stone
    const grad = ctx.createRadialGradient(x - r*0.3, y - r*0.3, r*0.05, x, y, r);
    grad.addColorStop(0, '#555');
    grad.addColorStop(0.4, '#222');
    grad.addColorStop(1, '#0a0a0a');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fill();
    // Shine
    const shine = ctx.createRadialGradient(x - r*0.32, y - r*0.35, 0, x - r*0.2, y - r*0.2, r*0.55);
    shine.addColorStop(0, 'rgba(255,255,255,0.22)');
    shine.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = shine;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fill();
  } else {
    // White stone
    const grad = ctx.createRadialGradient(x - r*0.28, y - r*0.28, r*0.05, x, y, r);
    grad.addColorStop(0, '#fff');
    grad.addColorStop(0.5, '#ece4d0');
    grad.addColorStop(1, '#c2b595');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#a89060';
    ctx.lineWidth = 0.8;
    ctx.stroke();
    // Shine
    const shine = ctx.createRadialGradient(x - r*0.3, y - r*0.33, 0, x - r*0.18, y - r*0.18, r*0.5);
    shine.addColorStop(0, 'rgba(255,255,255,0.78)');
    shine.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = shine;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.restore();

  // Last move marker
  if (isLast) {
    ctx.strokeStyle = player === 1 ? 'rgba(255,255,255,0.55)' : 'rgba(80,50,10,0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(x, y, r * 0.35, 0, Math.PI*2);
    ctx.stroke();
  }
}

function drawWinLine() {
  if (winLine.length < 2) return;
  const a = winLine[0], b = winLine[winLine.length-1];
  ctx.strokeStyle = 'rgba(255,200,50,0.75)';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.shadowColor = '#ffd050';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.moveTo(px(a[1]), px(a[0]));
  ctx.lineTo(px(b[1]), px(b[0]));
  ctx.stroke();
  ctx.shadowBlur = 0;
}

function render() {
  drawBoard();
  const winSet = new Set(winLine.map(([r,c]) => r*SIZE+c));
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (board[r][c]) {
        const isLast = lastMove && lastMove[0]===r && lastMove[1]===c;
        const isWin = winSet.has(r*SIZE+c);
        drawStone(c, r, board[r][c], isLast, isWin);
      }
    }
  }
  if (winLine.length > 0) drawWinLine();
}

function checkWin(r, c, player) {
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  for (const [dr, dc] of dirs) {
    let line = [[r,c]];
    for (let d = 1; d < 5; d++) {
      const nr = r+dr*d, nc = c+dc*d;
      if (nr<0||nr>=SIZE||nc<0||nc>=SIZE||board[nr][nc]!==player) break;
      line.push([nr,nc]);
    }
    for (let d = 1; d < 5; d++) {
      const nr = r-dr*d, nc = c-dc*d;
      if (nr<0||nr>=SIZE||nc<0||nc>=SIZE||board[nr][nc]!==player) break;
      line.unshift([nr,nc]);
    }
    if (line.length >= 5) return line;
  }
  return null;
}

function updateUI() {
  const cardB = document.getElementById('card-black');
  const cardW = document.getElementById('card-white');
  const status = document.getElementById('status');
  const moveCount = document.getElementById('move-count');

  cardB.className = 'player-card';
  cardW.className = 'player-card';

  document.getElementById('wins-black').textContent = wins[1];
  document.getElementById('wins-white').textContent = wins[2];
  moveCount.textContent = moveHistory.length + '수';

  if (gameOver) {
    if (winLine.length > 0) {
      const winner = currentPlayer === 1 ? 2 : 1;
      const name = winner === 1 ? '흑돌' : '백돌';
      status.textContent = `${name} 승리! 🎉`;
      status.className = 'status-box win';
      if (winner === 1) cardB.className = 'player-card winner';
      else cardW.className = 'player-card winner';
    }
  } else {
    status.className = 'status-box';
    const name = currentPlayer === 1 ? '흑돌' : '백돌';
    status.textContent = `${name}의 차례`;
    if (currentPlayer === 1) cardB.className = 'player-card active';
    else cardW.className = 'player-card active';
  }
}

// Hover preview
let hoverPos = null;
canvas.addEventListener('mousemove', e => {
  if (gameOver) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleY;
  const col = Math.round((mx - PADDING) / CELL);
  const row = Math.round((my - PADDING) / CELL);
  if (col >= 0 && col < SIZE && row >= 0 && row < SIZE && !board[row][col]) {
    if (!hoverPos || hoverPos[0] !== row || hoverPos[1] !== col) {
      hoverPos = [row, col];
      render();
      // Ghost stone
      ctx.globalAlpha = 0.3;
      drawStone(col, row, currentPlayer, false, false);
      ctx.globalAlpha = 1.0;
    }
  } else {
    if (hoverPos) { hoverPos = null; render(); }
  }
});

canvas.addEventListener('mouseleave', () => {
  if (hoverPos) { hoverPos = null; render(); }
});

canvas.addEventListener('click', e => {
  if (gameOver) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleY;
  const col = Math.round((mx - PADDING) / CELL);
  const row = Math.round((my - PADDING) / CELL);

  if (col < 0 || col >= SIZE || row < 0 || row >= SIZE) return;
  if (board[row][col] !== 0) return;

  board[row][col] = currentPlayer;
  lastMove = [row, col];
  moveHistory.push({row, col, player: currentPlayer});

  const line = checkWin(row, col, currentPlayer);
  if (line) {
    winLine = line;
    wins[currentPlayer]++;
    gameOver = true;
    render();
    updateUI();
    return;
  }

  // Check draw
  if (moveHistory.length === SIZE * SIZE) {
    gameOver = true;
    document.getElementById('status').textContent = '무승부!';
    document.getElementById('status').className = 'status-box win';
    render(); return;
  }

  currentPlayer = currentPlayer === 1 ? 2 : 1;
  render();
  updateUI();
});

// Touch support
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  const touch = e.changedTouches[0];
  canvas.dispatchEvent(new MouseEvent('click', {
    clientX: touch.clientX, clientY: touch.clientY
  }));
}, { passive: false });

function resetGame() {
  board = Array.from({length: SIZE}, () => Array(SIZE).fill(0));
  currentPlayer = 1;
  gameOver = false;
  moveHistory = [];
  lastMove = null;
  winLine = [];
  hoverPos = null;
  render();
  updateUI();
  document.getElementById('status').className = 'status-box';
}

function undoMove() {
  if (gameOver || moveHistory.length === 0) return;
  const last = moveHistory.pop();
  board[last.row][last.col] = 0;
  lastMove = moveHistory.length > 0 ? [moveHistory[moveHistory.length-1].row, moveHistory[moveHistory.length-1].col] : null;
  currentPlayer = last.player;
  winLine = [];
  render();
  updateUI();
}

// Init
render();
updateUI();
</script>
</body>
</html>
