name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # =======================================================
      # [추가된 부분] 스크립트 실행 전 .env.local 파일을 물리적으로 생성
      # =======================================================
      - name: Create .env.local file
        run: |
          touch .env.local
          echo "CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" >> .env.local
          echo "CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}" >> .env.local
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env.local
          echo "GOOGLE_VISION_API_KEY=${{ secrets.GOOGLE_VISION_API_KEY }}" >> .env.local
          echo "NEXT_PUBLIC_ADSENSE_ID=${{ secrets.NEXT_PUBLIC_ADSENSE_ID }}" >> .env.local
          echo "PUBLIC_DATA_API_KEY=${{ secrets.PUBLIC_DATA_API_KEY }}" >> .env.local
          echo "REALESTATE_API_KEY=${{ secrets.REALESTATE_API_KEY }}" >> .env.local

      - name: Run automation scripts
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/run-if-enabled.js update_idioms scripts/generate-daily-idiom.js || true
          sleep 10
          node scripts/run-if-enabled.js update_wisdom scripts/generate-daily-wisdom.js || true
          sleep 10
          node scripts/run-if-enabled.js update_news scripts/generate-daily-ai-news.js || true
          sleep 10
          node scripts/run-if-enabled.js update_economy scripts/generate-daily-economy.js || true
          sleep 10
          node scripts/run-if-enabled.js update_stocks scripts/generate-daily-stocks.js || true
          sleep 10
          node scripts/run-if-enabled.js update_books scripts/generate-daily-books.js || true
          sleep 10
          node scripts/run-if-enabled.js update_public_data scripts/fetch-public-data.js || true
          sleep 10
          node scripts/run-if-enabled.js update_geoje_events scripts/fetch-geoje-events.js || true
          sleep 10
          node scripts/run-if-enabled.js update_rss_events scripts/fetch-rss-events.js || true
          sleep 10
          node scripts/run-if-enabled.js update_restaurants scripts/update-restaurant-ranking.js || true
          sleep 10
          node scripts/run-if-enabled.js update_blog_posts scripts/generate-blog-post.js || true
          sleep 10
          node scripts/run-if-enabled.js update_realestate scripts/generate-realestate.js || true
          sleep 10
          node scripts/run-if-enabled.js update_youth_support scripts/generate-youth-support.js || true
          sleep 10
          node scripts/run-if-enabled.js update_farm_support scripts/generate-farm-support.js || true
          sleep 10
          node scripts/run-if-enabled.js update_welfare scripts/generate-welfare.js || true

      - name: Commit and push changes
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "자동 업데이트: 공공데이터 수집 및 블로그 글 생성"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Build project
        env:
          NEXT_PUBLIC_ADSENSE_ID: ${{ secrets.NEXT_PUBLIC_ADSENSE_ID }}
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_COUPANG_PARTNER_ID: ${{ secrets.NEXT_PUBLIC_COUPANG_PARTNER_ID }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy out --project-name=chamnongkkun-info
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}